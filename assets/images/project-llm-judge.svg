  <text x="430" y="365" text-anchor="middle" fill="#94A3B8" font-family="Arial" font-size="8">Rel</text>
  <text x="490" y="365" text-anchor="middle" fill="#94A3B8" font-family="Arial" font-size="8">Safe</text>
  <text x="550" y="365" text-anchor="middle" fill="#94A3B8" font-family="Arial" font-size="8">Flu</text>
  <text x="610" y="365" text-anchor="middle" fill="#94A3B8" font-family="Arial" font-size="8">Det</text>
  <text x="670" y="365" text-anchor="middle" fill="#94A3B8" font-family="Arial" font-size="8">Avg</text>
