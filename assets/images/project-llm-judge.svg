<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F8FAFC"/>
      <stop offset="100%" style="stop-color:#EDE9FE"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7C3AED"/>
      <stop offset="100%" style="stop-color:#6D28D9"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg2)"/>
  
  <!-- Dashboard frame -->
  <rect x="60" y="40" width="680" height="420" rx="16" fill="white" stroke="#D9E1EC" stroke-width="1"/>
  <rect x="60" y="40" width="680" height="48" rx="16" fill="#F8FAFC"/>
  <circle cx="88" cy="64" r="6" fill="#EF4444"/>
  <circle cx="108" cy="64" r="6" fill="#F59E0B"/>
  <circle cx="128" cy="64" r="6" fill="#10B981"/>
  <rect x="300" y="56" width="200" height="16" rx="8" fill="#E2E8F0"/>
  
  <!-- Left sidebar -->
  <rect x="60" y="88" width="180" height="372" fill="#F8FAFC"/>
  <rect x="76" y="108" width="148" height="32" rx="8" fill="url(#purple)" opacity="0.1"/>
  <rect x="92" y="118" width="100" height="12" rx="6" fill="#7C3AED"/>
  <rect x="76" y="152" width="148" height="28" rx="6" fill="transparent"/>
  <rect x="92" y="160" width="80" height="10" rx="5" fill="#CBD5E1"/>
  <rect x="76" y="188" width="148" height="28" rx="6" fill="transparent"/>
