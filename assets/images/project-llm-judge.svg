  <rect x="92" y="232" width="70" height="10" rx="5" fill="#CBD5E1"/>
  
  <!-- Main content - Score cards -->
  <rect x="260" y="108" width="150" height="100" rx="12" fill="white" stroke="#E2E8F0" stroke-width="1"/>
  <text x="335" y="150" text-anchor="middle" fill="#7C3AED" font-family="Arial" font-size="32" font-weight="bold">17</text>
  <text x="335" y="175" text-anchor="middle" fill="#64748B" font-family="Arial" font-size="10">CRITERIA</text>
  
  <rect x="426" y="108" width="150" height="100" rx="12" fill="white" stroke="#E2E8F0" stroke-width="1"/>
  <text x="501" y="150" text-anchor="middle" fill="#10B981" font-family="Arial" font-size="32" font-weight="bold">50K+</text>
  <text x="501" y="175" text-anchor="middle" fill="#64748B" font-family="Arial" font-size="10">WEEKLY</text>
  
  <rect x="592" y="108" width="130" height="100" rx="12" fill="white" stroke="#E2E8F0" stroke-width="1"/>
  <text x="657" y="150" text-anchor="middle" fill="#2457D6" font-family="Arial" font-size="28" font-weight="bold">+10%</text>
  <text x="657" y="175" text-anchor="middle" fill="#64748B" font-family="Arial" font-size="10">ACCURACY</text>
  
  <!-- Chart area -->
  <rect x="260" y="224" width="462" height="200" rx="12" fill="white" stroke="#E2E8F0" stroke-width="1"/>
  <text x="280" y="252" fill="#0B1220" font-family="Arial" font-size="12" font-weight="600">Evaluation Metrics</text>
  
  <!-- Bar chart -->
