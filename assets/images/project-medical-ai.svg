<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EAF1FF"/>
      <stop offset="100%" style="stop-color:#F8FAFC"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2457D6"/>
      <stop offset="100%" style="stop-color:#183FA8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Chat bubbles -->
  <rect x="80" y="80" width="320" height="80" rx="16" fill="white" stroke="#D9E1EC" stroke-width="1"/>
  <rect x="100" y="100" width="200" height="12" rx="6" fill="#E2E8F0"/>
  <rect x="100" y="120" width="260" height="10" rx="5" fill="#CBD5E1"/>
  <rect x="100" y="138" width="180" height="10" rx="5" fill="#CBD5E1"/>
  <circle cx="60" cy="120" r="20" fill="url(#accent)"/>
  <text x="60" y="126" text-anchor="middle" fill="white" font-family="Arial" font-size="18" font-weight="bold">AI</text>
  
  <rect x="400" y="180" width="320" height="80" rx="16" fill="url(#accent)"/>
  <rect x="420" y="200" width="200" height="12" rx="6" fill="rgba(255,255,255,0.3)"/>
  <rect x="420" y="220" width="260" height="10" rx="5" fill="rgba(255,255,255,0.2)"/>
  <rect x="420" y="238" width="180" height="10" rx="5" fill="rgba(255,255,255,0.2)"/>
  <circle cx="740" cy="220" r="20" fill="#10B981"/>
  <text x="740" y="226" text-anchor="middle" fill="white" font-family="Arial" font-size="14" font-weight="bold">Rx</text>
  
  <rect x="80" y="280" width="400" height="60" rx="12" fill="white" stroke="#D9E1EC" stroke-width="1"/>
  <rect x="100" y="296" width="300" height="10" rx="5" fill="#E2E8F0"/>
  <rect x="100" y="314" width="240" height="10" rx="5" fill="#CBD5E1"/>
  
  <!-- Medical cross -->
  <rect x="580" y="60" width="160" height="160" rx="20" fill="white" stroke="#D9E1EC" stroke-width="1"/>
  <rect x="640" y="80" width="40" height="120" rx="8" fill="#EF4444" opacity="0.8"/>
  <rect x="600" y="120" width="120" height="40" rx="8" fill="#EF4444" opacity="0.8"/>
  
  <!-- Stats -->
  <rect x="580" y="260" width="160" height="80" rx="12" fill="white" stroke="#D9E1EC" stroke-width="1"/>
  <text x="660" y="295" text-anchor="middle" fill="#2457D6" font-family="Arial" font-size="28" font-weight="bold">95%</text>
  <text x="660" y="320" text-anchor="middle" fill="#64748B" font-family="Arial" font-size="11">ACCURACY</text>
  
  <!-- Bottom bar -->
  <rect x="80" y="380" width="640" height="60" rx="12" fill="white" stroke="#D9E1EC" stroke-width="1"/>
  <rect x="100" y="400" width="80" height="8" rx="4" fill="#2457D6" opacity="0.6"/>
  <rect x="200" y="400" width="120" height="8" rx="4" fill="#E2E8F0"/>
  <rect x="340" y="400" width="100" height="8" rx="4" fill="#E2E8F0"/>
  <rect x="460" y="400" width="140" height="8" rx="4" fill="#E2E8F0"/>
  <rect x="100" y="418" width="60" height="6" rx="3" fill="#CBD5E1"/>
  <rect x="180" y="418" width="90" height="6" rx="3" fill="#CBD5E1"/>
  <rect x="290" y="418" width="70" height="6" rx="3" fill="#CBD5E1"/>
</svg>