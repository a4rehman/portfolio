<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF7ED"/>
      <stop offset="100%" style="stop-color:#F8FAFC"/>
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D97706"/>
      <stop offset="100%" style="stop-color:#B45309"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg3)"/>
  
  <!-- Steel surface -->
  <rect x="60" y="60" width="400" height="300" rx="8" fill="#64748B" opacity="0.15"/>
  <rect x="60" y="60" width="400" height="300" rx="8" fill="url(#bg3)" stroke="#D9E1EC" stroke-width="1"/>
  
  <!-- Defect patterns -->
  <ellipse cx="160" cy="150" rx="40" ry="25" fill="#DC2626" opacity="0.3"/>
  <ellipse cx="160" cy="150" rx="30" ry="18" fill="#DC2626" opacity="0.2"/>
  <text x="160" y="155" text-anchor="middle" fill="#DC2626" font-family="Arial" font-size="10" font-weight="bold">DEFECT</text>
  
  <rect x="280" y="120" width="80" height="60" rx="4" fill="#F59E0B" opacity="0.3"/>
  <rect x="290" y="130" width="60" height="40" rx="2" fill="#F59E0B" opacity="0.2"/>
  <text x="320" y="155" text-anchor="middle" fill="#D97706" font-family="Arial" font-size="10" font-weight="bold">SCRATCH</text>
  
  <circle cx="380" cy="250" r="35" fill="#7C3AED" opacity="0.2"/>
  <circle cx="380" cy="250" r="25" fill="#7C3AED" opacity="0.15"/>
  <text x="380" y="255" text-anchor="middle" fill="#7C3AED" font-family="Arial" font-size="10" font-weight="bold">PIT</text>
  
  <ellipse cx="180" cy="280" rx="50" ry="20" fill="#0891B2" opacity="0.25"/>
  <text x="180" y="285" text-anchor="middle" fill="#0891B2" font-family="Arial" font-size="10" font-weight="bold">CRACK</text>
  
  <!-- Detection boxes -->
  <rect x="115" y="118" width="90" height="65" rx="2" fill="none" stroke="#DC2626" stroke-width="2" stroke-dasharray="4"/>
  <rect x="270" y="110" width="100" height="80" rx="2" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4"/>
  <rect x="340" y="215" width="80" height="70" rx="2" fill="none" stroke="#7C3AED" stroke-width="2" stroke-dasharray="4"/>
  <rect x="125" y="258" width="110" height="45" rx="2" fill="none" stroke="#0891B2" stroke-width="2" stroke-dasharray="4"/>
  
  <!-- Right panel - Results -->
  <rect x="490" y="60" width="250" height="300" rx="12" fill="white" stroke="#D9E1EC" stroke-width="1"/>
  <text x="510" y="92" fill="#0B1220" font-family="Arial" font-size="14" font-weight="700">Detection Results</text>
  
  <!-- Result items -->
  <rect x="510" y="108" width="210" height="40" rx="8" fill="#FEF2F2"/>
  <circle cx="530" cy="128" r="8" fill="#DC2626"/>
  <text x="546" y="132" fill="#DC2626" font-family="Arial" font-size="11" font-weight="600">Defect Detected</text>
  <text x="700" y="132" text-anchor="end" fill="#DC2626" font-family="Arial" font-size="11" font-weight="700">98%</text>
  
  <rect x="510" y="156" width="210" height="40" rx="8" fill="#FFFBEB"/>
  <circle cx="530" cy="176" r="8" fill="#F59E0B"/>
  <text x="546" y="180" fill="#D97706" font-family="Arial" font-size="11" font-weight="600">Scratch Found</text>
  <text x="700" y="180" text-anchor="end" fill="#D97706" font-family="Arial" font-size="11" font-weight="700">94%</text>
  
  <rect x="510" y="204" width="210" height="40" rx="8" fill="#F5F3FF"/>
  <circle cx="530" cy="224" r="8" fill="#7C3AED"/>
  <text x="546" y="228" fill="#7C3AED" font-family="Arial" font-size="11" font-weight="600">Pit Mark</text>
  <text x="700" y="228" text-anchor="end" fill="#7C3AED" font-family="Arial" font-size="11" font-weight="700">91%</text>
  
  <rect x="510" y="252" width="210" height="40" rx="8" fill="#ECFEFF"/>
  <circle cx="530" cy="272" r="8" fill="#0891B2"/>
  <text x="546" y="276" fill="#0891B2" font-family="Arial" font-size="11" font-weight="600">Crack Line</text>
  <text x="700" y="276" text-anchor="end" fill="#0891B2" font-family="Arial" font-size="11" font-weight="700">89%</text>
  
  <!-- Accuracy badge -->
  <rect x="510" y="304" width="210" height="40" rx="8" fill="url(#orange)"/>
  <text x="615" y="328" text-anchor="middle" fill="white" font-family="Arial" font-size="12" font-weight="700">92% ACCURACY</text>
  
  <!-- Bottom stats -->
  <rect x="60" y="380" width="680" height="80" rx="12" fill="white" stroke="#D9E1EC" stroke-width="1"/>
  <rect x="80" y="396" width="140" height="48" rx="8" fill="#FFF7ED"/>
  <text x="150" y="418" text-anchor="middle" fill="#D97706" font-family="Arial" font-size="18" font-weight="700">92%</text>
  <text x="150" y="434" text-anchor="middle" fill="#64748B" font-family="Arial" font-size="9">DETECTION</text>
  
  <rect x="240" y="396" width="140" height="48" rx="8" fill="#F0FDF4"/>
  <text x="310" y="418" text-anchor="middle" fill="#15803D" font-family="Arial" font-size="18" font-weight="700">4</text>
  <text x="310" y="434" text-anchor="middle" fill="#64748B" font-family="Arial" font-size="9">DEFECT TYPES</text>
  
  <rect x="400" y="396" width="140" height="48" rx="8" fill="#EFF6FF"/>
  <text x="470" y="418" text-anchor="middle" fill="#2457D6" font-family="Arial" font-size="18" font-weight="700">&lt;100ms</text>
  <text x="470" y="434" text-anchor="middle" fill="#64748B" font-family="Arial" font-size="9">INFERENCE</text>
  
  <rect x="560" y="396" width="160" height="48" rx="8" fill="#F5F3FF"/>
  <text x="640" y="418" text-anchor="middle" fill="#7C3AED" font-family="Arial" font-size="18" font-weight="700">CNN</text>
  <text x="640" y="434" text-anchor="middle" fill="#64748B" font-family="Arial" font-size="9">ARCHITECTURE</text>
</svg>